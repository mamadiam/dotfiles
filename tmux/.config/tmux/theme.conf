# tmux theme: carbon (john-json colors_dark inspired)
set -g mode-style "fg=#000000,bg=#dcaf6c"
set -g status-style "bg=#000000,fg=#b4b4b4"
set -g status-left "#[fg=#dcaf6c,bold] 力 #[fg=#cdcdcd,bold]#S "
set -g status-left-length 40
set -g status-right "#[fg=#5a5959]%a %d %b #[fg=#b4b4b4]│ #[fg=#cdcdcd]%H:%M "
set -g status-right-length 40
set -g window-status-format "#[fg=#5a5959] #I #W "
set -g window-status-current-format "#[fg=#000000,bg=#dcaf6c,bold] #I #W "
set -g window-status-separator ""
set -g pane-border-style "fg=#2a2a2a"
set -g pane-active-border-style "fg=#dcaf6c"
set -g message-style "bg=#dcaf6c,fg=#000000"
set -g message-command-style "bg=#dcaf6c,fg=#000000"
set -g copy-mode-match-style "bg=#2a2a2a"
set -g copy-mode-current-match-style "bg=#c6755b,fg=#000000"
