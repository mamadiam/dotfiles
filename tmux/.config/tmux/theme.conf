# tmux theme: sumi — paper and ink (hand-rolled, no plugin)
# Bone on black, hairline separators, vermillion where it matters.

set -g mode-style "fg=#000000,bg=#cdc4ba"

set -g status-style "bg=#000000,fg=#b0a9a0"
set -g status-left "#[fg=#e2342a,bold] 力 #[fg=#cdc4ba,bold]#S "
set -g status-left-length 40
set -g status-right "#[fg=#7a756e]%a %d %b #[fg=#b0a9a0]│ #[fg=#cdc4ba]%H:%M "
set -g status-right-length 40

set -g window-status-format "#[fg=#7a756e] #I #W "
set -g window-status-current-format "#[fg=#000000,bg=#cdc4ba,bold] #I #W "
set -g window-status-separator ""

set -g pane-border-style "fg=#353330"
set -g pane-active-border-style "fg=#e2342a"

set -g message-style "bg=#cdc4ba,fg=#000000"
set -g message-command-style "bg=#cdc4ba,fg=#000000"

set -g copy-mode-match-style "bg=#454138"
set -g copy-mode-current-match-style "bg=#e2342a,fg=#000000"
