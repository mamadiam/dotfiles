# tmux — ctrl-space prefix, themed via theme.conf (sumi paper-and-ink)
# Plugins install with: prefix + I  (tpm is cloned by scripts/05-services.sh)

# --- Prefix: ctrl-space (frees ctrl-a for shell line start) ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Terminal correctness ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# --- Behavior ---
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# --- Vim-style pane navigation (prefix + h/j/k/l) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Quick reload ---
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# --- Plugins (managed by tpm) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'     # prefix + C-s saves sessions
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save + restore on boot

# --- Theme (switch with: scripts/theme.sh sumi|catppuccin) ---
source-file ~/.config/tmux/theme.conf

# --- resurrect/continuum options ---
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- tpm (keep at the very bottom) ---
run '~/.tmux/plugins/tpm/tpm'
