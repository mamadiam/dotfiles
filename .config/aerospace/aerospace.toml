# AeroSpace — i3-like tiling WM (no SIP disabling needed)
config-version = 2

# workspaces are DYNAMIC (GlazeWM-style): empty ones vanish, alt-N recreates.
# the sketchybar bar mirrors this — it only shows existing workspaces.# Docs: https://nikitabobko.github.io/AeroSpace/guide

# Move windows with ctrl+cmd + drag (also enabled in defaults.sh)
start-at-login = true

# SketchyBar integration: fire our custom event on workspace change
# (consumed by sketchybar items/spaces.lua; env vars are exported to it)
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_change']  # AEROSPACE_* env vars are inherited

# --- App → workspace auto-assignment ----------------------------------------
# Spotify's window refuses to shrink below ~800px, so tiling it alongside
# others overflows its slot and overlaps neighbors. It gets its own workspace.
on-window-detected = [
    { if.app-id = 'com.spotify.client', run = 'move-node-to-workspace 4' },
]


# Cursor follows focus when it lands on the other display (omerxx adoption)
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Refresh the bar's workspace dots on focus changes too (hasnarobert adoption)
on-focus-changed = ['exec-and-forget sketchybar --trigger aerospace_change']

# Normalizations: don't touch native fullscreen/tabs
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Breathing room in accordion layouts (alt-w) — cherry-picked from omerxx/dotfiles
accordion-padding = 300

[mode.main.binding]
# Focus — vim keys + arrow keys, alt as mod
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'
alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

# Resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Layouts
alt-f = 'fullscreen'
# Re-balance: the BSP tree grows nested/uneven as you move windows around;
# this flattens it back to equal splits (verified: 3 windows = 3 equal columns)
alt-shift-r = 'flatten-workspace-tree'
alt-t = 'layout floating tiling'
alt-e = 'layout tiles horizontal vertical'
alt-w = 'layout accordion horizontal vertical'

# Workspaces (1-5)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'

# QoL (adopted from omerxx/dotfiles)
alt-tab = 'workspace-back-and-forth'                          # bounce to the last workspace
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'  # ⌥⇧⇥: whole workspace to other monitor

# Service mode: alt+shift+/ to enter, esc to exit
alt-shift-slash = 'mode service'
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'secondary'
5 = 'secondary'
6 = 'secondary'
7 = 'secondary'
8 = 'secondary'

[gaps]
inner = { horizontal = 8, vertical = 8 }
# floating bar footprint: margin 5 + height 30 = 35px. macOS 27 STILL reserves
# ~28px for the hidden menu bar and AeroSpace stacks outer.top ON TOP of it —
# so outer.top 10 puts windows at ~38px, a 3px breath under the bar.
# (measured 2026-10-11: outer.top 40 → window top y=68, a 33px dead gap)
outer.top = 10
outer.left = 8
outer.bottom = 8
outer.right = 8

# --- App → workspace auto-assignment (uncomment and adapt) -------------------
# Fires when a window matching the regex appears.
# [on-window-detected]
# if-app-name-regex-substring = 'Arc'          # app name (case-insensitive substring)
# check-further-calls = false                  # skip after first match
# run = 'move-node-to-workspace 2'
#
# Common recipe:
#   browser → 2, chat/mail → 5, music → 4
