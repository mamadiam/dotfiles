# AeroSpace — i3-like tiling WM (no SIP disabling needed)
config-version = 2

# keep 1-5 alive when empty — sketchybar renders them at all times
persistent-workspaces = ["1", "2", "3", "4", "5"]
# Docs: https://nikitabobko.github.io/AeroSpace/guide

# Move windows with ctrl+cmd + drag (also enabled in defaults.sh)
start-at-login = true

# SketchyBar integration: fire our custom event on workspace change
# (consumed by sketchybar items/spaces.lua; env vars are exported to it)
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_change']  # AEROSPACE_* env vars are inherited

# --- App → workspace auto-assignment ----------------------------------------
# Spotify's window refuses to shrink below ~800px, so tiling it alongside
# others overflows its slot and overlaps neighbors. It gets its own workspace.
on-window-detected = [
    { if.app-id = 'com.spotify.client', run = 'move-node-to-workspace 4' },
]


# Cursor follows focus when it lands on the other display (omerxx adoption)
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Normalizations: don't touch native fullscreen/tabs
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

[mode.main.binding]
# Focus — vim keys + arrow keys, alt as mod
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'
alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

# Resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Layouts
alt-f = 'fullscreen'
# Re-balance: the BSP tree grows nested/uneven as you move windows around;
# this flattens it back to equal splits (verified: 3 windows = 3 equal columns)
alt-shift-r = 'flatten-workspace-tree'
alt-t = 'layout floating tiling'
alt-e = 'layout tiles horizontal vertical'
alt-w = 'layout accordion horizontal vertical'

# Workspaces (1-5)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'

# QoL (adopted from omerxx/dotfiles)
alt-tab = 'workspace-back-and-forth'                          # bounce to the last workspace
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'  # ⌥⇧⇥: whole workspace to other monitor

# Service mode: alt+shift+/ to enter, esc to exit
alt-shift-slash = 'mode service'
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'secondary'
5 = 'secondary'

[gaps]
inner = { horizontal = 8, vertical = 8 }
# outer.top per monitor: clears the floating bar (34px footprint incl. offset) —
# with the macOS menu bar hidden, nothing else reserves that space
# NOTE: macOS 27 still reserves ~28px for the menu bar behind sketchybar.
# top = 34 - 28 = 6 makes windows sit flush under the bar. If you ever hide
# the menu bar properly (Control Center -> autohide), raise top back to 34.
# per-monitor top: bar bottom sits at y=34; the built-in also reserves 28px
# for the (hidden) menu bar — windows start at reserve + top
outer.top = [{ monitor.main = 28 }, 46]
outer.left = 8
outer.bottom = 8
outer.right = 8

# --- App → workspace auto-assignment (uncomment and adapt) -------------------
# Fires when a window matching the regex appears.
# [on-window-detected]
# if-app-name-regex-substring = 'Arc'          # app name (case-insensitive substring)
# check-further-calls = false                  # skip after first match
# run = 'move-node-to-workspace 2'
#
# Common recipe:
#   browser → 2, chat/mail → 5, music → 4
