# starship — minimal prompt, Catppuccin Mocha palette
# scripts/theme.sh carbon|catppuccin flips the active palette.
# Only what matters: dir, git, duration, language versions, exit status.

add_newline = false
palette = "carbon"

[palettes.carbon]
paper = "#131313"
ink = "#cdcdcd"
ink_dim = "#b4b4b4"
ink_muted = "#8a8a8a"
ink_faint = "#5a5959"
sun = "#dcaf6c"
red = "#c6755b"
green = "#98a8a9"
yellow = "#dcaf6c"
blue = "#a2aab9"
peach = "#d09367"

[palettes.catppuccin_mocha]
ink = "#cdd6f4"
sun = "#cba6f7"
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b4"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[directory]
style = "bold ink"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bold sun"

[git_status]
style = "bold red"

[character]
success_symbol = "[❯](bold ink)"
error_symbol = "[❯](bold sun)"

[cmd_duration]
min_time = 2000
style = "bold yellow"

[nodejs]
style = "bold green"

[python]
style = "bold yellow"

[rust]
style = "bold peach"
