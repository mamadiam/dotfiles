# tmux — ctrl-space prefix, themed via theme.conf (sumi paper-and-ink)
# Plugins install with: prefix + I  (tpm is cloned by scripts/05-services.sh)

# --- Prefix: ctrl-space (frees ctrl-a for shell line start) ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Terminal correctness ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# --- Behavior ---
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# --- Vim-style pane navigation (prefix + h/j/k/l) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Quick reload ---
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# --- Plugins (managed by tpm) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'     # prefix + C-s saves sessions
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save + restore on boot
set -g @plugin 'omerxx/tmux-sessionx'             # prefix + o: session manager popup
set -g @plugin 'omerxx/tmux-floax'                # prefix + p: floating scratch terminal
set -g @plugin 'wfxr/tmux-fzf-url'                # prefix + u: open URLs in the pane via fzf
set -g @plugin 'fcsonline/tmux-thumbs'            # hints: grab URLs/paths without the mouse

# --- sessionx (adopted from omerxx/dotfiles) ---
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'                 # session list fed by your zoxide DB
set -g @sessionx-custom-paths '~/Projects'
set -g @sessionx-window-height '75%'
set -g @sessionx-window-width '75%'

# --- floax (adopted from omerxx/dotfiles) ---
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-change-path 'true'                  # scratch inherits the cwd you opened it from

# --- Theme (switch with: scripts/theme.sh sumi|catppuccin) ---
source-file ~/.config/tmux/theme.conf

# --- resurrect/continuum options ---
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- tpm (keep at the very bottom) ---
# plugins live under ~/.config/tmux/plugins (gitignored) — NOT ~/.tmux
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
run '~/.config/tmux/plugins/tpm/tpm'
