# yazi — sumi: paper and ink
# Bone on black, vermillion accents, hairline borders.
# Adapted for this repo; design language from Ryoku (ryoku.dev)

[manager]
cwd = { fg = "#958f87" }

hovered = { fg = "#000000", bg = "#cdc4ba" }
preview_hovered = { fg = "#000000", bg = "#cdc4ba" }

find_keyword = { fg = "#e2342a", bold = true, underline = true }
find_position = { fg = "#958f87", bold = true }

marker_selected = { fg = "#9daa84", bg = "#9daa84" }
marker_copied = { fg = "#d8a657", bg = "#d8a657" }
marker_cut = { fg = "#e2342a", bg = "#e2342a" }

tab_active = { fg = "#000000", bg = "#cdc4ba" }
tab_inactive = { fg = "#7a756e", bg = "#0a0a0a" }
tab_width = 1

count_copied = { fg = "#000000", bg = "#d8a657" }
count_selected = { fg = "#000000", bg = "#9daa84" }
count_cut = { fg = "#000000", bg = "#e2342a" }

border_symbol = "│"
border_style = { fg = "#353330" }

symlink = { fg = "#8fb5b8", italic = true }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#0a0a0a", bg = "#0a0a0a" }

mode_normal = { fg = "#000000", bg = "#cdc4ba", bold = true }
mode_select = { fg = "#000000", bg = "#9daa84", bold = true }
mode_unset = { fg = "#000000", bg = "#e2342a", bold = true }

progress_label = { fg = "#cdc4ba", bold = true }
progress_normal = { fg = "#b0a9a0", bg = "#1a1817" }
progress_error = { fg = "#e2342a", bg = "#1a1817" }

permissions_t = { fg = "#7f9dbe" }
permissions_r = { fg = "#d8a657" }
permissions_w = { fg = "#e2342a" }
permissions_x = { fg = "#9daa84" }
permissions_s = { fg = "#7a756e" }

[input]
border = { fg = "#b0a9a0" }
value = {}
selected = { reversed = true }

[select]
border = { fg = "#b0a9a0" }
active = { fg = "#cdc4ba" }
inactive = {}

[which]
cols = 3
mask = { bg = "#0a0a0a" }
cand = { fg = "#cdc4ba" }
rest = { fg = "#7a756e" }
desc = { fg = "#958f87" }
separator = "  "
separator_style = { fg = "#353330" }

[completion]
border = { fg = "#b0a9a0" }
active = { fg = "#000000", bg = "#cdc4ba" }
inactive = { fg = "#cdc4ba" }

[notify]
title_info = { fg = "#7f9dbe" }
title_warn = { fg = "#d8a657" }
title_error = { fg = "#e2342a" }

[filetype]
rules = [
  { mime = "image/*", fg = "#8fb5b8" },
  { mime = "{audio,video}/*", fg = "#c39ac3" },
  { mime = "application/{zip,rar,7z,tar,gz,xz,zstd,bz2,lzma}", fg = "#d8a657" },
  { mime = "application/{pdf,doc,rtf}", fg = "#9daa84" },
  { name = "*Dockerfile*", fg = "#7f9dbe" },
  { name = "*.md", fg = "#b0a9a0" },
  { name = "*.toml", fg = "#d8a657" },
  { name = "*.lock", fg = "#7a756e" },
  { name = "*/", fg = "#cdc4ba", bold = true },
]
