# tmux theme: catppuccin mocha (hand-rolled fallback, same layout as sumi)

set -g mode-style "fg=#1e1e2e,bg=#cba6f7"

set -g status-style "bg=#1e1e2e,fg=#a6adc8"
set -g status-left "#[fg=#cba6f7,bold] #[fg=#cdd6f4,bold]#S "
set -g status-left-length 40
set -g status-right "#[fg=#6c7086]%a %d %b #[fg=#a6adc8]│ #[fg=#cdd6f4]%H:%M "
set -g status-right-length 40

set -g window-status-format "#[fg=#6c7086] #I #W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I #W "
set -g window-status-separator ""

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"

set -g message-style "bg=#cba6f7,fg=#1e1e2e"
set -g message-command-style "bg=#cba6f7,fg=#1e1e2e"

set -g copy-mode-match-style "bg=#45475a"
set -g copy-mode-current-match-style "bg=#f38ba8,fg=#1e1e2e"
