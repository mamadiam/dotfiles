# tmux theme: tokyonight (tcmmichaelb139-inspired, Tokyonight Night)
set -g mode-style "fg=#1a1b26,bg=#7aa2f7"
set -g status-style "bg=#16161e,fg=#a9b1d6"
set -g status-left "#[fg=#7aa2f7,bold] #[fg=#c0caf5,bold]#S "
set -g status-left-length 40
set -g status-right "#[fg=#565f89]%a %d %b #[fg=#a9b1d6]│ #[fg=#c0caf5]%H:%M "
set -g status-right-length 40
set -g window-status-format "#[fg=#545c7e] #I #W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I #W "
set -g window-status-separator ""
set -g pane-border-style "fg=#2f334d"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#7aa2f7,fg=#1a1b26"
set -g message-command-style "bg=#7aa2f7,fg=#1a1b26"
set -g copy-mode-match-style "bg=#292e42"
set -g copy-mode-current-match-style "bg=#bb9af7,fg=#1a1b26"
